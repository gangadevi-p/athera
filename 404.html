<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Aethera</title>
    <script>
      // Redirect deep links back through index.html for the SPA router.
      (function () {
        var base = '/athera';
        var path = window.location.pathname.replace(base, '') || '/';
        window.location.replace(
          base + '/?p=' + encodeURIComponent(path) + window.location.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
